{% if user.is_authenticated %}
  <li class="dropdown"><a href="#"><span>Bienvenido, {{ user.username }}!</span> <i class="bi bi-chevron-down"></i></a>
    <ul>
      {% if user.is_cliente %}
      <li><a href="{% url 'Mipedido' %}">Mi Cuenta</a></li>
      {% elif user.is_admin %}
      <li><a href="{% url 'MiAdministrativoDashBoard' %}">Mi Administracion</a></li>
      {% endif %}
      <li><a href="{% url 'logout' %}">Cerrar Sesion</a></li>
    </ul>
  </li>
  
{% else %}
<li><a id="login-btn" class="nav-link scrollto " name="button">Iniciar Sesion</a></li>
<!-- <li><a class="getstarted scrollto" href="">Crear cuenta</a></li> -->
<li><a id="signup-btn" class="getstarted" name="button">Crear cuenta</a></li>
{% endif %}
